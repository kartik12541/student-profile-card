<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Card</title>

    <style>

        body {
            margin: 0;
            background-color: #0F172A;
            font-family: 'Poppins', sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        .profile-card {
            width: 600px;
            max-width: 90%;

            background-color: #FFFFFF;

            padding: 40px;

            border-radius: 18px;

            text-align: center;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }


        .profile-card h1 {
            margin-top: 0;
            margin-bottom: 8px;

            font-size: 36px;
            font-weight: 700;

            color: #0F172A;
        }


        .course {
            margin-top: 0;

            font-size: 18px;
            font-weight: 500;

            color: #2563EB;
        }


        .about h2,
        .skills h2,
        .education h2 {
            color: #0F172A;
        }


        .about p {
            font-size: 15px;
            color: #64748B;
            line-height: 1.6;
        }


        .skill-list {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }


        .skill-list span {
            background-color: #EFF6FF;

            color: #2563EB;

            padding: 8px 16px;

            border-radius: 20px;

            font-weight: 500;

            border: 1px solid #BFDBFE;
        }


        .education {
            background-color: #F8FAFC;

            border: 1px solid #E2E8F0;

            padding: 20px;

            border-radius: 12px;

            margin-top: 25px;
        }


        .degree {
            color: #0F172A;
            font-weight: 600;
        }


        .university {
            color: #64748B;
        }


        button {
            margin-top: 25px;

            background-color: #2563EB;

            color: #FFFFFF;

            border: none;

            padding: 12px 24px;

            border-radius: 8px;

            font-family: 'Poppins', sans-serif;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;
        }


        button:hover {
            background-color: #1D4ED8;

            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.3);
        }

    </style>
</head>

<body>

    <div class="profile-card">

        <h1>Kartik Arya</h1>

        <p class="course">B.Tech CSE Student</p>


        <section class="about">

            <h2>About Me</h2>

            <p>
                I am a B.Tech CSE student interested in programming
                and web development.
            </p>

        </section>


        <section class="skills">

            <h2>My Skills</h2>

            <div class="skill-list">

                <span>HTML</span>
                <span>CSS</span>
                <span>Java</span>
                <span>C Programming</span>

            </div>

        </section>


        <section class="education">

            <h2>Education</h2>

            <p class="degree">
                B.Tech — Computer Science & Engineering
            </p>

            <p class="university">
                Invertis University
            </p>

        </section>


        <button>Contact Me</button>

    </div>

</body>
</html>
